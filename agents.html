    <main class="deck" id="main" data-deck aria-roledescription="carousel" aria-label="Agent workflows">

        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93a7b0"/></marker>
          <marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e9c8e"/></marker>
        </defs>
      </svg>

      <div class="deck__wrap">
      <div class="deck__frame" data-frame>
        <div class="deck__progress"><span data-progress></span></div>
        <div class="stage" data-stage></div>
      </div>

      <div class="deck__bar">
        <button class="deck__btn" type="button" data-prev aria-label="Previous slide">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="deck__dots" data-dots role="group" aria-label="Slides"></div>
        <button class="deck__btn" type="button" data-next aria-label="Next slide">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="deck__count" data-count aria-live="polite">01 / 09</span>
        <button class="deck__btn deck__btn--full" type="button" data-full aria-pressed="false" aria-label="Full screen">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      </div>
      <p class="deck__rotate">Turn your phone sideways for a larger view.</p>

      <noscript><p class="deck__noscript">The agent workflow slides need JavaScript. The same tools are described on the <a href="index.html#work">main page</a>.</p></noscript>

        <button class="modal__close" type="button" data-close data-close-btn aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <p class="kicker" data-m-kicker></p>
        <h2 class="modal__title" id="modal-title" data-m-title></h2>
        <div class="modal__body" data-m-body></div>
        <dl class="facts" data-m-facts></dl>
        <div class="modal__links">
          <p class="label">Connected to</p>
          <ul data-m-links></ul>
