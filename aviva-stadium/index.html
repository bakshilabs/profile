<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aviva Stadium Analysis</title>
    <meta name="description" content="Modelled sun exposure and outdoor thermal comfort for the pitch and seating bowl of the Aviva Stadium, for every hour of a typical year." />
    <meta name="theme-color" content="#f6f5f0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%2359c7fc'/%3E%3Cstop offset='1' stop-color='%2316ffc6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M7 24L16 7.5L25.5 21.5Z' fill='none' stroke='url(%23g)' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cg fill='url(%23g)'%3E%3Ccircle cx='7' cy='24' r='4.2'/%3E%3Ccircle cx='16' cy='7.5' r='4.2'/%3E%3Ccircle cx='25.5' cy='21.5' r='4.2'/%3E%3C/g%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/analysis-Ao1ChGDv.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/meshopt_decoder.module-ByCVv9ZF.js">
    <link rel="stylesheet" crossorigin href="./assets/analysis-Sa0Oz2tW.css">
  </head>
  <body>
    <div id="loading" class="loading" role="status">
      <div>
        <h1>Aviva Stadium analysis</h1>
        <p id="loadText">Loading the results</p>
        <div class="loadbar"><i id="loadBar"></i></div>
      </div>
    </div>

    <div class="app viz-root" id="app" hidden>
      <header class="topbar">
        <a class="brand" href="../" aria-label="Bakshi Labs home">
          <span class="brand__name">Bakshi Labs</span>
        </a>
        <span class="vrule" aria-hidden="true"></span>
        <div class="titles">
          <h1>Aviva Stadium: sun and thermal comfort</h1>
          <p id="subtitle" class="sub"></p>
        </div>
        <div class="topbar-tools">
          <button class="ghost filter-btn" id="filterBtn" type="button" aria-expanded="false" aria-controls="filters"></button>
          <a class="ghost linkbtn" id="twinLink" href="twin.html">Digital twin</a>
          <a class="ghost linkbtn" id="filmLink" href="film/aviva-solar-comfort.mp4">Watch the film</a>
          <button class="ghost" id="aboutBtn" type="button">About</button>
          <button class="ghost" id="themeBtn" type="button" aria-label="Switch between light and dark">Theme</button>
        </div>
        <section class="filters" id="filters" hidden aria-label="Filters. They apply to everything on the page."></section>
      </header>

      <div class="workspace">
        <section class="stage-col" id="viewCard" aria-label="3D view of the stadium">
          <details class="toolbar" id="toolbar" open>
            <summary>Controls</summary>
            <div class="view-tools" id="viewTools"></div>
          </details>
          <div class="view-stage" id="stage">
            <div class="view-label" id="labelA"></div>
            <div class="view-label right" id="labelB" hidden></div>
            <div class="view-divider" id="divider" hidden></div>
            <div class="view-hint">Drag to orbit, scroll to zoom, click a seat or the pitch to inspect it.</div>
          </div>
          <div class="legend-row" id="legendRow"></div>
          <div class="time-tools" id="timeTools"></div>
        </section>

        <aside class="panel" aria-label="Results">
          <section class="kpis" id="kpis" aria-label="Headline figures for the selected period"></section>
          <nav class="tabs" id="tabs" role="tablist" aria-label="Results"></nav>
          <div class="panes" id="panes">
            <div class="pane" id="side" role="tabpanel"></div>
            <div class="pane" id="paneYear" role="tabpanel" hidden></div>
            <div class="pane" id="paneSections" role="tabpanel" hidden></div>
          </div>
          <footer class="foot" id="foot"></footer>
        </aside>
      </div>
    </div>

    <dialog id="about" class="about" aria-labelledby="aboutTitle"></dialog>
  </body>
</html>
